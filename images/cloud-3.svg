<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 260" width="800" height="260">
  <defs>
    <linearGradient id="body" gradientUnits="userSpaceOnUse" x1="0" y1="31" x2="0" y2="239">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset=".45" stop-color="#FBFDFF"/>
      <stop offset=".75" stop-color="#E4EDF6"/>
      <stop offset="1" stop-color="#C2D3E6"/>
    </linearGradient>
    <filter id="billow" x="-25%" y="-30%" width="150%" height="160%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.011" numOctaves="4" seed="23" result="n1"/>
      <feDisplacementMap in="SourceGraphic" in2="n1" scale="90" xChannelSelector="R" yChannelSelector="G" result="d1"/>
      <feTurbulence type="fractalNoise" baseFrequency="0.045" numOctaves="3" seed="30" result="n2"/>
      <feDisplacementMap in="d1" in2="n2" scale="26" xChannelSelector="G" yChannelSelector="R" result="d2"/>
      <feGaussianBlur in="d2" stdDeviation="2.4"/>
    </filter>
    <filter id="soft" x="-30%" y="-40%" width="160%" height="180%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="3" seed="26" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="50" xChannelSelector="R" yChannelSelector="G" result="d"/>
      <feGaussianBlur in="d" stdDeviation="10"/>
    </filter>
  </defs>
  <g filter="url(#billow)" fill="url(#body)">
    <ellipse cx="400" cy="180" rx="340" ry="52"/><ellipse cx="170" cy="155" rx="95" ry="55"/><ellipse cx="320" cy="135" rx="110" ry="70"/><ellipse cx="470" cy="140" rx="105" ry="66"/><ellipse cx="620" cy="160" rx="100" ry="50"/><ellipse cx="720" cy="185" rx="70" ry="32"/><ellipse cx="80" cy="185" rx="70" ry="30"/>
  </g>
  <g filter="url(#soft)" fill="#B7C9DE" opacity=".38">
    <ellipse cx="300" cy="195" rx="120" ry="18"/><ellipse cx="540" cy="195" rx="120" ry="18"/>
  </g>
  <g filter="url(#soft)" fill="#FFFFFF" opacity=".75">
    <ellipse cx="330" cy="100" rx="75" ry="30"/><ellipse cx="480" cy="108" rx="65" ry="26"/>
  </g>
</svg>

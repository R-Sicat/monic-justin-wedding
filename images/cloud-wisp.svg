<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 200" width="700" height="200">
  <defs>
    <linearGradient id="body" gradientUnits="userSpaceOnUse" x1="0" y1="24" x2="0" y2="184">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset=".45" stop-color="#FBFDFF"/>
      <stop offset=".75" stop-color="#E4EDF6"/>
      <stop offset="1" stop-color="#C2D3E6"/>
    </linearGradient>
    <filter id="billow" x="-25%" y="-30%" width="150%" height="160%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.006 0.03" numOctaves="4" seed="41" result="n1"/>
      <feDisplacementMap in="SourceGraphic" in2="n1" scale="110" xChannelSelector="R" yChannelSelector="G" result="d1"/>
      <feTurbulence type="fractalNoise" baseFrequency="0.045" numOctaves="3" seed="48" result="n2"/>
      <feDisplacementMap in="d1" in2="n2" scale="18" xChannelSelector="G" yChannelSelector="R" result="d2"/>
      <feGaussianBlur in="d2" stdDeviation="5"/>
    </filter>
    <filter id="soft" x="-30%" y="-40%" width="160%" height="180%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="3" seed="44" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="50" xChannelSelector="R" yChannelSelector="G" result="d"/>
      <feGaussianBlur in="d" stdDeviation="10"/>
    </filter>
  </defs>
  <g filter="url(#billow)" fill="url(#body)">
    <ellipse cx="350" cy="105" rx="280" ry="30"/><ellipse cx="240" cy="95" rx="120" ry="26"/><ellipse cx="450" cy="92" rx="130" ry="28"/><ellipse cx="330" cy="85" rx="90" ry="22"/>
  </g>
  <g filter="url(#soft)" fill="#B7C9DE" opacity=".38">
    
  </g>
  <g filter="url(#soft)" fill="#FFFFFF" opacity=".75">
    
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 320" width="600" height="320">
  <defs>
    <linearGradient id="body" gradientUnits="userSpaceOnUse" x1="0" y1="38" x2="0" y2="294">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset=".45" stop-color="#FBFDFF"/>
      <stop offset=".75" stop-color="#E4EDF6"/>
      <stop offset="1" stop-color="#C2D3E6"/>
    </linearGradient>
    <filter id="billow" x="-25%" y="-30%" width="150%" height="160%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.011" numOctaves="4" seed="11" result="n1"/>
      <feDisplacementMap in="SourceGraphic" in2="n1" scale="90" xChannelSelector="R" yChannelSelector="G" result="d1"/>
      <feTurbulence type="fractalNoise" baseFrequency="0.045" numOctaves="3" seed="18" result="n2"/>
      <feDisplacementMap in="d1" in2="n2" scale="26" xChannelSelector="G" yChannelSelector="R" result="d2"/>
      <feGaussianBlur in="d2" stdDeviation="2.4"/>
    </filter>
    <filter id="soft" x="-30%" y="-40%" width="160%" height="180%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="3" seed="14" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="50" xChannelSelector="R" yChannelSelector="G" result="d"/>
      <feGaussianBlur in="d" stdDeviation="10"/>
    </filter>
  </defs>
  <g filter="url(#billow)" fill="url(#body)">
    <ellipse cx="300" cy="225" rx="240" ry="55"/><ellipse cx="180" cy="190" rx="90" ry="65"/><ellipse cx="270" cy="160" rx="95" ry="88"/><ellipse cx="385" cy="140" rx="110" ry="95"/><ellipse cx="480" cy="200" rx="80" ry="55"/><ellipse cx="110" cy="225" rx="70" ry="38"/>
  </g>
  <g filter="url(#soft)" fill="#B7C9DE" opacity=".38">
    <ellipse cx="225" cy="235" rx="60" ry="22"/><ellipse cx="440" cy="232" rx="70" ry="22"/><ellipse cx="320" cy="250" rx="190" ry="14"/>
  </g>
  <g filter="url(#soft)" fill="#FFFFFF" opacity=".75">
    <ellipse cx="380" cy="95" rx="75" ry="38"/><ellipse cx="260" cy="125" rx="50" ry="28"/>
  </g>
</svg>
